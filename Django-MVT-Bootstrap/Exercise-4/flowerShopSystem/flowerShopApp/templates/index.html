{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container-fluid bg-light">
        <div class="container d-flex py-3 justify-content-center align-items-center">
            <div class="container-fluid d-flex justify-content-center align-items-center">
                <img src="{% static 'images/cover.png' %}" alt="" height="250px" width="500px">
            </div>

            <div class="container-fluid">
                <h1 class="text-center">Welcome to our Flower Shop!</h1>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="container d-flex justify-content-center align-items-center py-4">
            {% for b in bouquets %}
                <div class="card mx-2" style="width: 18rem;">
                    <img src="{{ b.photo.url }}" class="card-img-top" alt="..." height="250px" width="250px">
                    <div class="card-body">
                        <h5 class="card-title">{{ b.name }}</h5>
                        <p class="card-text">{{ b.description }}</p>
                        <a href="{% url 'display' b.id %}" class="btn btn-primary">See bouquet information</a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
