{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.5-dist/css/bootstrap.min.css' %}">
</head>
<body>
<div class="container-fluid  align-items-center justify-content-center">
    <div class="container bg-light d-flex flex-column justify-content-center align-items-center mt-4 py-3">
        <h1>Add new car</h1>
        <form class="container d-flex flex-column justify-content-center align-items-center" method="post"
              style=" border: 1px solid black" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="container-fluid d-flex flex-column justify-content-center align-items-center">
                {{ form.as_p }}
            </div>
            <div class="container d-flex align-items-center justify-content-center ">
                <button class="btn btn-primary mx-2 " type="submit">Submit</button>
                <a href="/" class="btn btn-primary">Go Back</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
